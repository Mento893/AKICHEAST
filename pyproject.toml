[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "akicheast3d"
version = "0.1.0"
description = "Lungen-CTs dreidimensional darstellen und animieren"
authors = [{ name = "Mihailo Obradovic" }]
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
